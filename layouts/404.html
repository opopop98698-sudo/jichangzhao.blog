{{ define "main" }}
<div class="not-found-page" style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 4rem; color: var(--color-primary); margin-bottom: 1rem;">404</h1>
  <h2>页面未找到</h2>
  <p style="margin: 1.5rem 0; color: var(--color-text-muted);">您访问的页面不存在或已迁移。</p>
  <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
    <a href="/" class="btn-primary" style="padding: 0.6rem 1.5rem; text-decoration: none; border-radius: 6px; background: var(--color-primary); color: white;">返回首页</a>
    <a href="/search/" class="btn-secondary" style="padding: 0.6rem 1.5rem; text-decoration: none; border-radius: 6px; border: 1px solid var(--color-border); color: var(--color-text);">站内搜索</a>
  </div>
</div>
{{ end }}
